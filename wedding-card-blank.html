<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Card (Blank)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background: radial-gradient(circle at 20% 20%, #f3e8cb 0%, #e0cfab 55%, #cfbc93 100%); }
  .card { position:relative; width:min(760px, calc(100vw - 24px), calc((100vh - 24px) * 1110 / 1493)); aspect-ratio:1110/1493;
          box-shadow:0 24px 52px rgba(30,24,10,.28); overflow:hidden; }
  .card img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .text-layer {
    position: absolute;
    inset: 6.9% 10.7% 6.8%;
    text-align: center;
    color: #2f3b3c;
    padding: 2.8% 5.4% 3.2%;
    font-family: "Cinzel", serif;
  }

  .family {
    margin: 8.5% 0 3.8%;
    font-size: clamp(10px, 1.12vw, 15px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #3f4d4e;
  }

  .name {
    margin: 0;
    font-family: "Alex Brush", cursive;
    font-size: clamp(64px, 8.9vw, 122px);
    line-height: 0.78;
    color: #9a731f;
    font-weight: 400;
  }

  .and {
    margin: 2.6% 0 1.2%;
    font-size: clamp(11px, 1.22vw, 16px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #3f4d4e;
  }

  .invite {
    margin: 5.2% 0 2.8%;
    font-size: clamp(10px, 1.24vw, 17px);
    letter-spacing: 0.11em;
    line-height: 1.34;
    text-transform: uppercase;
    color: #3d4747;
  }

  .ornament {
    margin: 0 auto 2.2%;
    width: fit-content;
    color: #b08931;
    font-size: clamp(19px, 2.2vw, 30px);
    line-height: 1;
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    margin-top: 0;
    align-items: end;
    gap: 0;
  }

  .meta-col {
    border-top: 1px solid rgba(174, 134, 54, 0.6);
    border-bottom: 1px solid rgba(174, 134, 54, 0.6);
    padding: 0.5rem 0.25rem 0.62rem;
  }

  .meta-col.center {
    border-left: 1px solid rgba(174, 134, 54, 0.6);
    border-right: 1px solid rgba(174, 134, 54, 0.6);
  }

  .label {
    margin: 0;
    font-size: clamp(10px, 1.08vw, 14px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4f5b5b;
  }

  .value {
    margin: 0.26rem 0 0;
    font-size: clamp(22px, 2.7vw, 45px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #8f6817;
    font-weight: 500;
    line-height: 0.95;
  }

  .year {
    margin: 0.28rem 0 0;
    font-size: clamp(10px, 1.18vw, 16px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #4f5b5b;
  }

  .tagline {
    margin: 3% 0 3.2%;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(22px, 2.5vw, 36px);
    color: #3f5052;
    font-style: italic;
    line-height: 1;
  }

  .venue {
    margin: 4.6% 0 0;
    border-top: 1px solid rgba(174, 134, 54, 0.55);
    border-bottom: 1px solid rgba(174, 134, 54, 0.55);
    padding: 0.95rem 0.45rem 0.8rem;
  }

  .venue-title {
    margin: 0;
    font-size: clamp(29px, 3.15vw, 52px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1f3134;
  }

  .venue-address {
    margin: 0.35rem 0 0;
    font-size: clamp(19px, 2.2vw, 33px);
    letter-spacing: 0.05em;
    color: #33464a;
    text-transform: uppercase;
  }

  .reception {
    margin: 4.8% 0 0;
    color: #465758;
  }

  .reception-line {
    margin: 0;
    font-family: "Alex Brush", cursive;
    font-size: clamp(54px, 5.5vw, 82px);
    line-height: 1;
    color: #2e667f;
  }

  .reception-hall {
    margin: 0.48rem 0 0;
    font-size: clamp(17px, 2.1vw, 31px);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #324248;
  }

  @media (max-width: 620px) {
    .text-layer {
      inset: 6.8% 8.6% 6.5%;
      padding: 4.8% 4.8% 5.2%;
    }

    .family {
      margin-top: 11.5%;
    }

    .reception-line {
      font-size: clamp(40px, 7vw, 60px);
    }
  }
</style>
</head>
