<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="invitation" aria-label="Wedding invitation card">
        <img
          class="invitation-bg"
          src="assets/invitation-reference.jpeg"
          alt="Floral wedding frame"
        />

        <div class="content-panel">
          <p class="small-caps" data-field="familyLine"></p>

          <h1 class="name" data-field="groomName"></h1>
          <p class="and-text">and</p>
          <h1 class="name" data-field="brideName"></h1>

          <p class="invite-line" data-field="inviteLine"></p>

          <div class="date-time-grid">
            <div class="cell">
              <p class="cell-label">Day</p>
              <p class="cell-value" data-field="day"></p>
            </div>
            <div class="cell center-cell">
              <p class="cell-label">Date</p>
              <p class="cell-value" data-field="date"></p>
              <p class="cell-sub" data-field="year"></p>
            </div>
            <div class="cell">
              <p class="cell-label">Time</p>
              <p class="cell-value" data-field="time"></p>
            </div>
          </div>

          <p class="tagline" data-field="tagline"></p>

          <section class="venue-block">
            <h2 class="venue-title" data-field="ceremonyVenue"></h2>
            <p class="venue-address" data-field="ceremonyAddress"></p>
          </section>

          <section class="venue-block reception-block">
            <p class="reception-label">Reception to follow</p>
            <h2 class="venue-title" data-field="receptionVenue"></h2>
            <p class="venue-address" data-field="receptionAddress"></p>
          </section>

          <blockquote class="quote" data-field="quote"></blockquote>

          <p class="rsvp-label">R.S.V.P</p>
          <p class="rsvp-number" data-field="rsvp"></p>
        </div>
      </section>
    </main>

    <script>
      const invitationDetails = {
        familyLine: "Together with their families",
        groomName: "Anex",
        brideName: "Ansona",
        inviteLine: "joyfully invite you to celebrate their wedding",
        day: "Sunday",
        date: "January 25",
        year: "2026",
        time: "10:30 AM",
        tagline: "",
        ceremonyVenue: "St. Joseph's Church",
        ceremonyAddress: "Pezhumkandam, Kanchiyar, Idukki, Kerala 685511 (Plus Code: Q34G+884)",
        receptionVenue: "",
        receptionAddress: "",
        quote: "",
        rsvp: ""
      };

      for (const [field, value] of Object.entries(invitationDetails)) {
        const elements = document.querySelectorAll(`[data-field="${field}"]`);
        elements.forEach((element) => {
          element.textContent = value;
        });
      }

      // Hide optional sections when details are not provided.
      if (!invitationDetails.tagline.trim()) {
        document.querySelector(".tagline")?.remove();
      }

      if (!invitationDetails.quote.trim()) {
        document.querySelector(".quote")?.remove();
      }

      if (!invitationDetails.rsvp.trim()) {
        document.querySelector(".rsvp-label")?.remove();
        document.querySelector(".rsvp-number")?.remove();
      }

      if (!invitationDetails.receptionVenue.trim() && !invitationDetails.receptionAddress.trim()) {
        document.querySelector(".reception-block")?.remove();
      }
    </script>
  </body>
</html>
