<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation | Anex & Ansona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #9b7420;
      --ink: #2f3a3a;
      --soft-bg: #eee2c6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #f3e8cb 0%, #e0cfab 55%, #cfbc93 100%);
      padding: 16px;
      color: var(--ink);
    }

    .card {
      position: relative;
      width: min(95vw, 760px);
      aspect-ratio: 1110 / 1536;
      box-shadow: 0 24px 52px rgba(30, 24, 10, 0.28);
      border-radius: 2px;
      overflow: hidden;
    }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      padding: 10% 14% 11%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .top-line {
      margin: 7.2% 0 4.2%;
      font: 500 clamp(11px, 1.3vw, 16px) / 1.1 Cinzel, serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5959;
    }

    .name {
      margin: 0;
      color: var(--gold);
      font: 400 clamp(44px, 8vw, 82px) / 0.9 "Great Vibes", cursive;
    }

    .and {
      margin: 1.1% 0 1.2%;
      font: 500 clamp(11px, 1.3vw, 16px) / 1.1 Cinzel, serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #4f5959;
    }

    .invite {
      margin: 4.2% 0 5%;
      font: 500 clamp(10px, 1.2vw, 15px) / 1.35 Cinzel, serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3b4748;
    }

    .meta {
      margin-top: 3.8%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      align-items: center;
    }

    .meta .label {
      margin: 0;
      font: 600 clamp(11px, 1.2vw, 14px) / 1 Cinzel, serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4d5758;
    }

    .meta .value {
      margin: 0.35rem 0 0;
      font: 600 clamp(13px, 1.8vw, 24px) / 1.05 Cinzel, serif;
      letter-spacing: 0.03em;
      color: #8e6817;
      text-transform: uppercase;
    }

    .meta .sub {
      margin: 0.22rem 0 0;
      font: 500 clamp(10px, 1.2vw, 15px) / 1 Cinzel, serif;
      letter-spacing: 0.12em;
      color: #4d5758;
      text-transform: uppercase;
    }

    .tag {
      margin: 6.2% 0 3.2%;
      font: 400 clamp(22px, 3.2vw, 40px) / 1 "Great Vibes", cursive;
      color: #56686a;
    }

    .venue {
      margin: 4.2% 0 0;
    }

    .venue .title {
      margin: 0;
      font: 600 clamp(15px, 2vw, 28px) / 1.1 Cinzel, serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1f2c2e;
    }

    .venue .addr {
      margin: 0.35rem 0 0;
      font: 500 clamp(12px, 1.5vw, 20px) / 1.3 Cinzel, serif;
      color: #394648;
    }

    @media (max-width: 620px) {
      .overlay { padding: 9% 10% 10%; }
      .top-line { margin-top: 10.5%; }
    }
  </style>
</head>
<body>
  <section class="card" aria-label="Wedding invitation">
    <img src="assets/invitation-reference.jpeg" alt="Wedding invitation floral frame" />

    <div class="overlay">
      <p class="top-line">Together with their families</p>

      <h1 class="name">Anex</h1>
      <p class="and">and</p>
      <h1 class="name">Ansona</h1>

      <p class="invite">Joyfully invite you to celebrate their wedding</p>

      <div class="meta">
        <div>
          <p class="label">Day</p>
          <p class="value">Sunday</p>
        </div>
        <div>
          <p class="label">Date</p>
          <p class="value">Jan 25</p>
          <p class="sub">2026</p>
        </div>
        <div>
          <p class="label">Time</p>
          <p class="value">10:30 AM</p>
        </div>
      </div>

      <p class="tag">two hearts, one faith, one promise</p>

      <div class="venue">
        <p class="title">St. Joseph's Church</p>
        <p class="addr">Pezhumkandam, Kanchiyar, Idukki, Kerala 685511</p>
      </div>
    </div>
  </section>
</body>
</html>
